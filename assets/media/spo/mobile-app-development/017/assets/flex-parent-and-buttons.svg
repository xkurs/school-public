<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Контейнер и две кнопки</title><desc id="desc">Пунктир обозначает nav.actions, внутри — две кнопки button. Flexbox задан родителю и располагает его непосредственных детей.</desc>
<rect width="640" height="400" rx="12" fill="white"/><g font-family="Arial, sans-serif">
<text x="24" y="34" font-size="24" fill="#1E293B" font-weight="bold">Контейнер и его непосредственные дети</text>
<rect x="32" y="66" width="576" height="230" rx="6" fill="#EFF6FF" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
<text x="52" y="103" font-size="23" fill="#1E293B" font-weight="bold">nav.actions — родитель</text>
<text x="52" y="131" font-size="20" fill="#475569" font-weight="normal">display: flex</text>
<rect x="56" y="157" width="248" height="94" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="74" y="188" font-size="19" fill="#475569" font-weight="normal">button</text>
<text x="74" y="224" font-size="25" fill="#1E293B" font-weight="bold">Сохранить</text>
<rect x="336" y="157" width="248" height="94" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="354" y="188" font-size="19" fill="#475569" font-weight="normal">button</text>
<text x="354" y="224" font-size="25" fill="#1E293B" font-weight="bold">Отмена</text>
<text x="24" y="335" font-size="22" fill="#1E293B" font-weight="normal">Flexbox располагает две целые кнопки.</text>
<text x="24" y="368" font-size="22" fill="#1E293B" font-weight="normal">Правило задаём родителю .actions.</text>
</g></svg>
