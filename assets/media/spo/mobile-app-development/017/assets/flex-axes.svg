<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Оси Flexbox: row и column</title>
  <desc id="desc">Слева три карточки идут горизонтально вдоль главной оси row. Справа три карточки идут вертикально вдоль главной оси column. Поперечная ось в обоих случаях перпендикулярна главной.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1d4ed8"/></marker></defs>
  <rect width="960" height="410" rx="14" fill="#eff6ff"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#1e293b">
    <text x="28" y="38" font-size="23" font-weight="700">flex-direction: row</text>
    <text x="510" y="38" font-size="23" font-weight="700">flex-direction: column</text>
    <rect x="48" y="115" width="360" height="150" rx="8" fill="white" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <g fill="#dbeafe" stroke="#1d4ed8"><rect x="65" y="140" width="95" height="100" rx="7"/><rect x="180" y="140" width="95" height="100" rx="7"/><rect x="295" y="140" width="95" height="100" rx="7"/></g>
    <g font-size="24" text-anchor="middle"><text x="112" y="197">1</text><text x="227" y="197">2</text><text x="342" y="197">3</text></g>
    <text x="52" y="76" font-size="18">Главная ось →</text>
    <path d="M50 92 H407" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M428 118 V262" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="65" y="300" font-size="18">Поперечная ось ↓</text>
    <rect x="565" y="110" width="290" height="205" rx="8" fill="white" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <g fill="#dbeafe" stroke="#1d4ed8"><rect x="610" y="124" width="200" height="48" rx="7"/><rect x="610" y="189" width="200" height="48" rx="7"/><rect x="610" y="254" width="200" height="48" rx="7"/></g>
    <g font-size="22" text-anchor="middle"><text x="710" y="155">1</text><text x="710" y="220">2</text><text x="710" y="285">3</text></g>
    <path d="M540 112 V314" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M568 92 H853" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="570" y="76" font-size="18">Поперечная ось →</text>
    <text x="565" y="345" font-size="18">Главная ось ↓</text>
    <text x="28" y="388" font-size="17">justify-content — вдоль главной оси; align-items — по поперечной оси.</text>
  </g>
</svg>
