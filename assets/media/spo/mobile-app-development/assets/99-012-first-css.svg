<svg xmlns="http://www.w3.org/2000/svg" width="970" height="525" viewBox="0 0 970 525" role="img" aria-labelledby="title desc">
<title id="title">Первые правила CSS</title>
<desc id="desc">Слева HTML без CSS, справа итог общего примера 00: синий h1, светлый фон, sans-serif и margin 24px.</desc>
<rect width="970" height="525" fill="#fff"/>
<text x="24" y="34" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Схема результата · общий пример 00</text>
<text x="24" y="82" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">До</text>
<text x="510" y="82" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">После</text>
<rect x="24" y="100" width="430" height="270" fill="#fff" stroke="#b8bec7"/>
<rect x="510" y="100" width="430" height="270" fill="#EFF6FF" stroke="#b8bec7"/>
<text x="32" y="164" font-family="serif" font-size="31" fill="#111" font-weight="700">Техника дома · V00</text>
<text x="32" y="222" font-family="serif" font-size="25" fill="#111" font-weight="400">Выберите технику для</text>
<text x="32" y="260" font-family="serif" font-size="25" fill="#111" font-weight="400">повседневных дел</text>
<text x="534" y="164" font-family="sans-serif" font-size="30" fill="#1D4ED8" font-weight="700">Техника дома · V00</text>
<text x="534" y="222" font-family="sans-serif" font-size="24" fill="#1E293B" font-weight="400">Выберите технику для</text>
<text x="534" y="260" font-family="sans-serif" font-size="24" fill="#1E293B" font-weight="400">повседневных дел</text>
<text x="24" y="414" font-family="sans-serif" font-size="21" fill="#475569" font-weight="400">Тот же текст; изменились цвет, фон, шрифт и отступы.</text>
<text x="24" y="455" font-family="sans-serif" font-size="21" fill="#475569" font-weight="400">h1: #1D4ED8 · текст: #1E293B · фон: #EFF6FF</text>
<text x="24" y="494" font-family="sans-serif" font-size="21" fill="#475569" font-weight="400">font-family: sans-serif; margin: 24px.</text>
</svg>
