<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
  <title id="title">Карточка и форма: разные области оформления</title>
  <desc id="desc">Учебная схема варианта Техника дома. Слева карточка холодильника с отступом и рамкой, справа форма с четырьмя крупными полями, двумя маленькими флажками и контуром фокуса кнопки. Форма показана целиком, части не являются готовым HTML.</desc>
  <rect width="960" height="820" rx="18" fill="#EFF6FF"/>
  <g font-family="Arial, sans-serif" fill="#1E293B">
    <text x="36" y="43" font-size="25" font-weight="bold">Техника дома · V00: цель оформления</text>
    <text x="36" y="74" font-size="18">Карточки и поля идут сверху вниз. Схема, а не снимок браузера.</text>
    <rect x="36" y="111" width="342" height="478" rx="12" fill="white" stroke="#94A3B8" stroke-width="2"/>
    <text x="60" y="145" font-size="20" fill="#1D4ED8" font-weight="bold">Холодильник</text>
    <rect x="131" y="169" width="142" height="244" rx="10" fill="#DBEAFE" stroke="#64748B" stroke-width="3"/>
    <path d="M132 251H272M251 197V232M251 278V315" fill="none" stroke="#64748B" stroke-width="5"/>
    <text x="60" y="452" font-size="19">300 л · 2 камеры</text>
    <text x="60" y="488" font-size="18">Для хранения свежих</text>
    <text x="60" y="514" font-size="18">и замороженных продуктов</text>
    <text x="60" y="565" font-size="17" fill="#475569">.card → все три карточки</text>
    <text x="37" y="628" font-size="18" font-weight="bold">Изображение сохраняет форму</text>
    <text x="37" y="659" font-size="18">Ширина ограничена;</text>
    <text x="37" y="687" font-size="18">высота вычисляется сама.</text>
    <text x="37" y="738" font-size="18">Рамка — граница блока.</text>
    <text x="37" y="767" font-size="18">Отступ — место внутри неё.</text>
    <rect x="410" y="111" width="514" height="677" rx="12" fill="white" stroke="#94A3B8" stroke-width="2"/>
    <text x="434" y="145" font-size="20" fill="#1D4ED8" font-weight="bold">Заказ техники</text>
    <text x="434" y="180" font-size="18" font-weight="bold">Товар</text>
    <rect x="434" y="191" width="466" height="44" rx="5" fill="white" stroke="#64748B"/>
    <text x="447" y="220" font-size="18">Выберите из списка</text>
    <path d="M870 207l8 10 8-10" fill="none" stroke="#1E293B" stroke-width="2"/>
    <text x="434" y="269" font-size="18" font-weight="bold">Количество единиц</text>
    <rect x="434" y="281" width="466" height="44" rx="5" fill="white" stroke="#64748B"/>
    <text x="447" y="310" font-size="18">1</text>
    <text x="434" y="360" font-size="18" font-weight="bold">Комментарий к заказу</text>
    <rect x="434" y="372" width="466" height="83" rx="5" fill="white" stroke="#64748B"/>
    <text x="447" y="401" font-size="17" fill="#475569">Например, удобный день доставки</text>
    <path d="M882 447l11-11M888 447l5-5" stroke="#64748B"/>
    <rect x="434" y="482" width="20" height="20" rx="2" fill="#1D4ED8"/>
    <path d="M438 492l4 5 8-10" fill="none" stroke="white" stroke-width="2"/>
    <text x="465" y="499" font-size="18">Нужна доставка</text>
    <rect x="434" y="521" width="20" height="20" rx="2" fill="white" stroke="#64748B"/>
    <text x="465" y="538" font-size="18">Нужна установка</text>
    <text x="434" y="581" font-size="18" font-weight="bold">Срочность заказа</text>
    <path d="M441 605H892" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <path d="M441 605H667" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="667" cy="605" r="10" fill="#1D4ED8"/>
    <text x="434" y="638" font-size="17">1 — Не срочно; 5 — Срочно</text>
    <rect x="428" y="665" width="234" height="57" rx="8" fill="none" stroke="#1D4ED8" stroke-width="3"/>
    <rect x="434" y="671" width="222" height="45" rx="5" fill="#1D4ED8"/>
    <text x="450" y="700" font-size="19" fill="white">Проверить заказ</text>
    <text x="434" y="757" font-size="17" fill="#475569">Контур показывает фокус клавиатуры</text>
  </g>
</svg>
