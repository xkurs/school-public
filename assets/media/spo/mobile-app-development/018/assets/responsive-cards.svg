<svg xmlns="http://www.w3.org/2000/svg" width="900" height="325" viewBox="0 0 900 325" role="img" aria-labelledby="title desc">
<title id="title">Родитель и перенос карточек</title><desc id="desc">В контейнере products три карточки. Первые две помещаются в первую строку, третья переходит на следующую.</desc>
<rect width="900" height="325" rx="16" fill="#eff6ff"/>
<g font-family="Arial, sans-serif" fill="#1e293b"><text x="28" y="38" font-size="23" font-weight="bold">.products — общий родитель трёх карточек</text><text x="28" y="70" font-size="18">display: flex; flex-wrap: wrap; gap: 1rem;</text>
<rect x="28" y="90" width="660" height="210" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
<g fill="white" stroke="#1d4ed8" stroke-width="3"><rect x="45" y="108" width="300" height="75" rx="7"/><rect x="365" y="108" width="305" height="75" rx="7"/><rect x="45" y="203" width="625" height="75" rx="7"/></g>
<g font-size="22"><text x="62" y="152">article.card 1</text><text x="382" y="152">article.card 2</text><text x="62" y="248">article.card 3</text></g>
<text x="716" y="148" font-size="18">Не хватает</text><text x="716" y="174" font-size="18">места?</text><text x="716" y="214" font-size="18">Следующая</text><text x="716" y="240" font-size="18">строка ↓</text></g></svg>
