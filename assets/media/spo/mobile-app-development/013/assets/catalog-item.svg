<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370">
<title>Одна позиция каталога техники</title><desc>Название, готовая иллюстрация холодильника, характеристика и описание объединены в article. Пунктирная рамка поясняет группу.</desc>
<rect width="800" height="370" rx="12" fill="#f4f7fa"/>
<g font-family="sans-serif" fill="#18354c">
<rect x="20" y="15" width="405" height="340" rx="8" fill="white" stroke="#427896" stroke-dasharray="6 4"/>
<text x="40" y="54" font-size="24">Холодильник</text>
<rect x="40" y="74" width="280" height="145" rx="6" fill="#eff6ff"/>
<rect x="135" y="88" width="85" height="116" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<path d="M135 125 H220 M147 105 V116 M147 140 V161 M149 204 V210 M207 204 V210" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="40" y="255" font-size="18">300 л · 2 камеры</text>
<text x="40" y="292" font-size="16">Для хранения свежих</text><text x="40" y="315" font-size="16">и замороженных продуктов</text>
<text x="450" y="54" font-size="20">h2 — название</text><text x="450" y="145" font-size="20">img — иллюстрация</text>
<text x="450" y="255" font-size="20">p — характеристика</text><text x="450" y="305" font-size="20">p — описание</text>
<text x="450" y="345" font-size="16">Весь блок объединяет article</text></g></svg>
