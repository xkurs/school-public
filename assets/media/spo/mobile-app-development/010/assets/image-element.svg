<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Изображение из отдельного файла</title>
<desc id="desc">fridge.svg общего примера 00 показан шириной 240. Справа пояснение к img.</desc>
<rect width="900" height="300" fill="#fff"/>
<text x="24" y="34" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Схема результата · общий пример 00</text>
<rect x="24" y="64" width="340" height="206" fill="#fff" stroke="#b8bec7"/>
<image x="44" y="86" width="240" height="180" href="data:image/svg+xml;base64,"/>
<text x="406" y="120" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">img · ширина 240</text>
<text x="406" y="158" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">images/fridge.svg</text>
<path d="M394 180 H302" fill="none" stroke="#475569" stroke-width="2"/>
</svg>
