<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Ссылка и её цель в одной странице</title>
<desc id="desc">Синяя подчёркнутая ссылка Посмотреть маршруты ведёт к заголовку Куда пойдём. Справа вне страницы обозначены href с решёткой catalog и id catalog; стрелка связывает их.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs>
<rect width="1000" height="500" fill="white"/>
<text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" >Схема результата</text>
<rect x="24" y="64" width="650" height="355" fill="#fff" stroke="#b8bec7"/><text x="44" y="119" font-family="Times New Roman, serif" font-size="28" font-weight="400" fill="#0000ee" text-decoration="underline">Посмотреть маршруты</text><text x="44" y="258" font-family="Times New Roman, serif" font-size="36" font-weight="700" fill="#111" >Куда пойдём?</text><text x="70" y="315" font-family="Times New Roman, serif" font-size="30" font-weight="400" fill="#111" >•</text><text x="100" y="315" font-family="Times New Roman, serif" font-size="28" font-weight="400" fill="#111" >Лесная тропа</text><text x="70" y="359" font-family="Times New Roman, serif" font-size="30" font-weight="400" fill="#111" >•</text><text x="100" y="359" font-family="Times New Roman, serif" font-size="28" font-weight="400" fill="#111" >Берег реки</text><text x="712" y="114" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" >href=&quot;#catalog&quot;</text><text x="712" y="258" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" >id=&quot;catalog&quot;</text><path d="M 702,108 H 400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 702,251 H 330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 840,133 V 214" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="461" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" >Стрелки и подписи справа — пояснения, не часть страницы.</text>
</svg>
