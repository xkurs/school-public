<svg xmlns="http://www.w3.org/2000/svg" width="970" height="580" viewBox="0 0 970 580" role="img" aria-labelledby="title desc">
<title id="title">Страница до и после первых правил CSS</title>
<desc id="desc">Слева обычный HTML с засечками и отступом 8; справа тот же текст без засечек с тёмно-зелёным h1, светло-зелёным фоном и отступом 24 пикселя. Подписи До и После вне страницы.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs>
<rect width="970" height="580" fill="white"/>
<text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" >Схема результата</text>
<text x="24" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" >До</text><text x="500" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" >После</text><rect x="24" y="104" width="440" height="330" fill="#fff" stroke="#b8bec7"/><rect x="500" y="104" width="440" height="330" fill="#F1F8E9" stroke="#b8bec7"/><text x="32" y="165" font-family="Times New Roman, serif" font-size="36" font-weight="700" fill="#111" >На тропе · V01</text><text x="32" y="219" font-family="Times New Roman, serif" font-size="24" font-weight="400" fill="#111" >Выберите прогулку</text><text x="32" y="254" font-family="Times New Roman, serif" font-size="24" font-weight="400" fill="#111" >для небольшой компании</text><text x="524" y="181" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="darkgreen" >На тропе · V01</text><text x="524" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1B3A24" >Выберите прогулку</text><text x="524" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#1B3A24" >для небольшой компании</text><text x="24" y="477" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" >Тот же текст; меняются цвет, фон, шрифт и отступы.</text><text x="24" y="513" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" >После: h1 — darkgreen; фон — #F1F8E9;</text><text x="24" y="545" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#475569" >sans-serif; margin: 24px.</text>
</svg>
