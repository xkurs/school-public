<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560"><rect width="760" height="560" rx="12" fill="#f4f7fa"/><g font-family="sans-serif" fill="#18354c"><text x="25" y="40" font-size="25">Заказ техники</text><text x="25" y="75" font-size="18">Товар</text><rect x="25" y="87" width="335" height="35" rx="4" fill="white" stroke="#427896"/><text x="35" y="111" font-size="17">Выберите из списка</text><path d="M333 101 l8 9 8-9" fill="none" stroke="#427896" stroke-width="2"/><text x="420" y="110" font-size="19">select + option</text><text x="25" y="154" font-size="18">Количество единиц</text><rect x="25" y="165" width="130" height="35" rx="4" fill="white" stroke="#427896"/><text x="35" y="189" font-size="18">1</text><text x="420" y="190" font-size="19">input type="number"</text><text x="25" y="235" font-size="18">Комментарий к заказу</text><rect x="25" y="248" width="335" height="70" rx="4" fill="white" stroke="#427896"/><text x="35" y="276" font-size="16" fill="#647583">Например, удобный день доставки</text><text x="420" y="280" font-size="19">textarea</text><rect x="25" y="341" width="18" height="18" fill="white" stroke="#427896"/><path d="M28 350 l5 5 8-11" fill="none" stroke="#245dc1" stroke-width="2"/><text x="55" y="356" font-size="17">Нужна доставка</text><rect x="25" y="375" width="18" height="18" fill="white" stroke="#427896"/><text x="55" y="390" font-size="17">Нужна установка</text><text x="420" y="375" font-size="19">input type="checkbox"</text><text x="25" y="428" font-size="18">Срочность заказа</text><path d="M25 448 H350" stroke="#8aa4b1" stroke-width="5"/><circle cx="188" cy="448" r="9" fill="#245dc1"/><text x="25" y="477" font-size="16">1 — Не срочно; 5 — Срочно</text><text x="420" y="453" font-size="19">input type="range"</text><rect x="25" y="500" width="190" height="38" rx="5" fill="#e0eaf0" stroke="#427896"/><text x="44" y="526" font-size="18">Проверить заказ</text><text x="420" y="526" font-size="19">button type="submit"</text></g></svg>
