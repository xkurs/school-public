<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="710" viewBox="0 0 1180 710" role="img"><title>Выравнивание кнопок и перенос текста</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36577b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5fa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17324d"><text x="35" y="45" font-size="30" fill="#17324d">Сначала контейнер, затем размеры кнопок</text><rect x="35" y="85" width="510" height="355" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="121" font-size="24" fill="#17324d">1. Components: выберите родителя</text><text x="65" y="170" font-size="22" fill="#17324d">Screen1</text><text x="90" y="210" font-size="22" fill="#17324d">└ VerticalArrangement</text><text x="120" y="250" font-size="22" fill="#17324d">├ ButtonRoutes</text><text x="120" y="290" font-size="22" fill="#17324d">└ ButtonBooking</text><text x="55" y="347" font-size="22" fill="#17324d">2. Properties → Width → Fill parent</text><text x="55" y="391" font-size="22" fill="#17324d">3. То же Width у каждой кнопки</text><rect x="590" y="85" width="550" height="355" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><rect x="655" y="115" width="420" height="290" rx="12" fill="#e8f1ea" stroke="#c8d4e1" stroke-width="2"/><text x="680" y="155" font-size="23" fill="#17324d">VerticalArrangement</text><rect x="680" y="190" width="370" height="75" rx="12" fill="#2e7d32" stroke="#c8d4e1" stroke-width="2"/><text x="708" y="235" font-size="22" fill="#fff">Посмотреть маршруты</text><rect x="680" y="285" width="370" height="105" rx="12" fill="#2e7d32" stroke="#c8d4e1" stroke-width="2"/><text x="730" y="327" font-size="23" fill="#fff">Записаться</text><text x="730" y="360" font-size="23" fill="#fff">на прогулку</text><rect x="35" y="475" width="1105" height="155" rx="12" fill="#fff5df" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="513" font-size="24" fill="#17324d">Текст переносится? Дайте кнопке достаточно высоты.</text><text x="55" y="553" font-size="22" fill="#17324d">Начните с Height → Automatic и проверьте слова на телефоне.</text><text x="55" y="593" font-size="21" fill="#17324d">Кнопки рядом: общий HorizontalArrangement; обеим по 100% не задавайте.</text><text x="40" y="675" font-size="21" fill="#17324d">Учебная схема. Цвета и компоновку сохраняйте по своему варианту.</text></g></svg>