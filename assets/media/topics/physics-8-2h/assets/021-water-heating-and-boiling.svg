<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Нагревание воды и кипение при постоянном давлении</title>
<desc id="desc">При нормальном атмосферном давлении температура чистой воды растёт от 20 до 100 градусов Цельсия, затем во время кипения остаётся постоянной, хотя вода продолжает получать теплоту.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker></defs>
<rect width="640" height="460" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172554">
<text x="24" y="32" font-size="26" font-weight="bold">Вода: нагревание и кипение</text>
<text x="24" y="62" font-size="22">Чистая вода, постоянное давление ≈101 кПа</text>
<g stroke="#94a3b8" stroke-dasharray="5 5"><path d="M80 130H555M80 310H555"/></g>
<path d="M80 360V90M80 360H595" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="19" y="105" font-size="23">t, °C</text>
<text x="27" y="138" font-size="23">100</text>
<text x="41" y="318" font-size="23">20</text>
<text x="597" y="367" font-size="24">Q</text>
<path d="M80 310 290 130" stroke="#2563eb" stroke-width="5" fill="none"/>
<path d="M290 130H555" stroke="#be123c" stroke-width="5" fill="none"/>
<circle cx="290" cy="130" r="6" fill="#be123c"/>
<text x="341" y="112" font-size="24" fill="#9f1239">Кипение</text>
<text x="100" y="170" font-size="23" fill="#1d4ed8">Нагревание</text>
<text x="325" y="190" font-size="22">Жидкость и пар</text>
<text x="325" y="220" font-size="22">Температура постоянна</text>
<text x="89" y="390" font-size="22">Q — полученная теплота</text>
<text x="24" y="432" font-size="20">Схема: длины участков условны, потери не учтены.</text>
</g></svg>
