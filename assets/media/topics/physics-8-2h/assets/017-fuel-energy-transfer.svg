<svg xmlns="http://www.w3.org/2000/svg" width="440" height="380" viewBox="0 0 440 380" role="img" aria-labelledby="title desc">
  <title id="title">Превращение энергии при сгорании топлива</title>
  <desc id="desc">При горении химическая энергия топлива и кислорода превращается во внутреннюю энергию и излучение. Энергия передаётся окружающим телам и нагревает их.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="440" height="380" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172554">
    <rect x="45" y="18" width="350" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="220" y="47" font-size="20">Химическая энергия</text>
    <text x="220" y="74" font-size="19">топлива и кислорода</text>
    <path d="M220 96V133" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="45" y="142" width="350" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="220" y="169" font-size="20">Горение</text>
    <text x="220" y="195" font-size="19">Внутренняя энергия</text>
    <text x="220" y="219" font-size="19">и излучение</text>
    <path d="M220 238V281" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="45" y="290" width="350" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="220" y="319" font-size="20">Нагревание окружающих тел</text>
    <text x="220" y="346" font-size="19">Передача энергии</text>
  </g>
</svg>
