<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 365" role="img" aria-labelledby="title desc">
  <title id="title">Тепловой баланс при плавлении льда в тёплой воде</title>
  <desc id="desc">Тёплая вода охлаждается и отдаёт энергию на плавление льда при нуле градусов и последующее нагревание талой воды до конечной температуры. Теплоёмкость сосуда и обмен с комнатой не учитываются.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#075db8"/></marker></defs>
  <rect width="520" height="365" rx="14" fill="#f2f8ff"/>
  <rect x="35" y="20" width="450" height="105" rx="12" fill="#fff0d7" stroke="#a76511" stroke-width="2"/>
  <rect x="15" y="220" width="235" height="125" rx="12" fill="#dff2ff" stroke="#075db8" stroke-width="2"/>
  <rect x="270" y="220" width="235" height="125" rx="12" fill="#e8f6ee" stroke="#237443" stroke-width="2"/>
  <g fill="#172c46" font-family="system-ui, sans-serif" font-size="23" text-anchor="middle">
    <text x="260" y="57">Тёплая вода охлаждается</text>
    <text x="260" y="94">и отдаёт энергию</text>
    <text x="132" y="258">На плавление льда</text>
    <text x="132" y="298">при 0 °C</text>
    <text x="388" y="255">На нагревание</text>
    <text x="388" y="289">талой воды</text>
    <text x="388" y="324">от 0 °C до t</text>
  </g>
  <path d="M260 126V165H132V212M260 165H388V212" fill="none" stroke="#075db8" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M132 190V212" stroke="#075db8" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
