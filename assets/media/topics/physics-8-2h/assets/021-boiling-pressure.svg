<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="title desc">
<title id="title">Как давление влияет на температуру кипения воды</title>
<desc id="desc">При пониженном давлении чистая вода кипит ниже ста градусов Цельсия, при нормальном атмосферном давлении около 101 килопаскаля — при ста, при повышенном — выше ста.</desc>
<rect width="640" height="540" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172554">
<text x="24" y="38" font-size="26" font-weight="bold">Давление и кипение чистой воды</text>
<rect x="24" y="65" width="592" height="125" rx="12" fill="#dbeafe"/>
<text x="44" y="99" font-size="24" font-weight="bold">Давление ниже нормального</text>
<text x="44" y="135" font-size="26" fill="#1d4ed8">Температура кипения ниже 100 °C</text>
<text x="44" y="170" font-size="22">Пример: высоко в горах</text>
<rect x="24" y="205" width="592" height="125" rx="12" fill="#dcfce7"/>
<text x="44" y="239" font-size="24" font-weight="bold">Нормальное атмосферное давление</text>
<text x="44" y="275" font-size="26" fill="#166534">Температура кипения — 100 °C</text>
<text x="44" y="310" font-size="22">Давление ≈101 кПа</text>
<rect x="24" y="345" width="592" height="125" rx="12" fill="#fef3c7"/>
<text x="44" y="379" font-size="24" font-weight="bold">Давление выше нормального</text>
<text x="44" y="415" font-size="26" fill="#92400e">Температура кипения выше 100 °C</text>
<text x="44" y="450" font-size="22">Пример: работающая скороварка</text>
<text x="24" y="514" font-size="22">100 °C — не универсальная температура кипения.</text>
</g></svg>
