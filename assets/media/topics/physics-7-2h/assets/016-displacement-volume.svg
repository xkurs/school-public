<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="title desc"><title id="title">Измерение объёма тела мензуркой</title><desc id="desc">В одинаковых мензурках начальный уровень воды50мл и уровень80мл после полного погружения тела. На шкалах одинаковый шаг10мл. Разность30мл равна объёму тела30см³. Тело расположено целиком ниже поверхности воды.</desc><rect width="640" height="590" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#24343b" text-anchor="start" font-weight="bold">Объём по вытесненной воде</text><text x="160" y="91" font-size="24" fill="#006c75" text-anchor="middle">До погружения</text><text x="470" y="91" font-size="24" fill="#167d37" text-anchor="middle">После</text><path d="M90 125 V390 H230 V125" fill="none" stroke="#24343b" stroke-width="3"/><rect x="92" y="265.0" width="136" height="125.0" rx="5" fill="#d9eef0" stroke="none" stroke-width="3"/><line x1="92" y1="265.0" x2="228" y2="265.0" stroke="#006c75" stroke-width="3"/><line x1="82" y1="390.0" x2="100" y2="390.0" stroke="#24343b" stroke-width="2"/><text x="76" y="397.0" font-size="21" fill="#24343b" text-anchor="end">0</text><line x1="82" y1="365.0" x2="100" y2="365.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="340.0" x2="100" y2="340.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="315.0" x2="100" y2="315.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="290.0" x2="100" y2="290.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="265.0" x2="100" y2="265.0" stroke="#24343b" stroke-width="2"/><text x="76" y="272.0" font-size="21" fill="#24343b" text-anchor="end">50</text><line x1="82" y1="240.0" x2="100" y2="240.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="215.0" x2="100" y2="215.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="190.0" x2="100" y2="190.0" stroke="#24343b" stroke-width="2"/><text x="76" y="197.0" font-size="21" fill="#24343b" text-anchor="end">80</text><line x1="82" y1="165.0" x2="100" y2="165.0" stroke="#24343b" stroke-width="2"/><line x1="82" y1="140.0" x2="100" y2="140.0" stroke="#24343b" stroke-width="2"/><text x="76" y="147.0" font-size="21" fill="#24343b" text-anchor="end">100</text><text x="160" y="427" font-size="27" fill="#006c75" text-anchor="middle">50 мл</text><path d="M400 125 V390 H540 V125" fill="none" stroke="#24343b" stroke-width="3"/><rect x="402" y="190.0" width="136" height="200.0" rx="5" fill="#d9eef0" stroke="none" stroke-width="3"/><path d="M440 315 L474 292 L505 319 L500 358 L458 367 L435 344 Z" fill="#8a6500" stroke="#5d4400" stroke-width="2"/><line x1="402" y1="190.0" x2="538" y2="190.0" stroke="#006c75" stroke-width="3"/><line x1="392" y1="390.0" x2="410" y2="390.0" stroke="#24343b" stroke-width="2"/><text x="386" y="397.0" font-size="21" fill="#24343b" text-anchor="end">0</text><line x1="392" y1="365.0" x2="410" y2="365.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="340.0" x2="410" y2="340.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="315.0" x2="410" y2="315.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="290.0" x2="410" y2="290.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="265.0" x2="410" y2="265.0" stroke="#24343b" stroke-width="2"/><text x="386" y="272.0" font-size="21" fill="#24343b" text-anchor="end">50</text><line x1="392" y1="240.0" x2="410" y2="240.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="215.0" x2="410" y2="215.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="190.0" x2="410" y2="190.0" stroke="#24343b" stroke-width="2"/><text x="386" y="197.0" font-size="21" fill="#24343b" text-anchor="end">80</text><line x1="392" y1="165.0" x2="410" y2="165.0" stroke="#24343b" stroke-width="2"/><line x1="392" y1="140.0" x2="410" y2="140.0" stroke="#24343b" stroke-width="2"/><text x="386" y="147.0" font-size="21" fill="#24343b" text-anchor="end">100</text><text x="470" y="427" font-size="27" fill="#006c75" text-anchor="middle">80 мл</text><text x="30" y="119" font-size="22" fill="#24343b" text-anchor="start">мл</text><text x="338" y="119" font-size="22" fill="#24343b" text-anchor="start">мл</text><text x="320" y="478" font-size="27" fill="#167d37" text-anchor="middle">Vтела = 80 − 50 = 30 мл</text><text x="320" y="519" font-size="26" fill="#167d37" text-anchor="middle">30 мл = 30 см³</text><text x="320" y="561" font-size="24" fill="#24343b" text-anchor="middle">Тело погружено полностью</text></g></svg>