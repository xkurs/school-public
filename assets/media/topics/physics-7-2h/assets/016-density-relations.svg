<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc"><title id="title">Три формулы для плотности, массы и объёма</title><desc id="desc">Чтобы найти плотность, делят массу на объём. Чтобы найти массу, умножают плотность на объём. Чтобы найти объём, делят массу на плотность. Единицы согласуют: килограммы с кубическими метрами либо граммы с кубическими сантиметрами.</desc><rect width="640" height="560" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="43" font-size="28" fill="#24343b" text-anchor="start" font-weight="bold">Что нужно найти?</text><rect x="25" y="76" width="590" height="115" rx="5" fill="#f5f8f9" stroke="none" stroke-width="3"/><text x="45" y="108" font-size="24" fill="#8a6500" text-anchor="start" font-weight="bold">Плотность</text><text x="590" y="109" font-size="27" fill="#8a6500" text-anchor="end">ρ = m / V</text><text x="45" y="161" font-size="24" fill="#24343b" text-anchor="start">Разделите массу на объём</text><rect x="25" y="206" width="590" height="115" rx="5" fill="#f5f8f9" stroke="none" stroke-width="3"/><text x="45" y="238" font-size="24" fill="#006c75" text-anchor="start" font-weight="bold">Массу</text><text x="590" y="239" font-size="27" fill="#006c75" text-anchor="end">m = ρ · V</text><text x="45" y="291" font-size="24" fill="#24343b" text-anchor="start">Умножьте плотность на объём</text><rect x="25" y="336" width="590" height="115" rx="5" fill="#f5f8f9" stroke="none" stroke-width="3"/><text x="45" y="368" font-size="24" fill="#b02069" text-anchor="start" font-weight="bold">Объём</text><text x="590" y="369" font-size="27" fill="#b02069" text-anchor="end">V = m / ρ</text><text x="45" y="421" font-size="24" fill="#24343b" text-anchor="start">Разделите массу на плотность</text><text x="320" y="493" font-size="25" fill="#24343b" text-anchor="middle">кг и м³ → кг/м³</text><text x="320" y="531" font-size="25" fill="#24343b" text-anchor="middle">г и см³ → г/см³</text></g></svg>