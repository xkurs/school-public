<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="title desc"><title id="title">Масса, объём и плотность</title><desc id="desc">Вверху два одинаковых объёма100см³: плотностям2,7 и7,8г/см³ соответствуют массы270 и780г. Внизу при равной массе100г плотностям2 и5г/см³ соответствуют объёмы50 и20см³. Площадь нижних прямоугольников пропорциональна объёму.</desc><rect width="640" height="590" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#24343b" text-anchor="start" font-weight="bold">Сравниваем плотности</text><text x="30" y="86" font-size="25" fill="#006c75" text-anchor="start">Равные объёмы: V = 100 см³</text><rect x="105" y="110" width="100" height="100" rx="5" fill="#d9eef0" stroke="#006c75" stroke-width="3"/><rect x="420" y="110" width="100" height="100" rx="5" fill="#f6e1eb" stroke="#b02069" stroke-width="3"/><text x="155" y="247" font-size="24" fill="#006c75" text-anchor="middle">ρ = 2,7 г/см³</text><text x="470" y="247" font-size="24" fill="#b02069" text-anchor="middle">ρ = 7,8 г/см³</text><text x="155" y="280" font-size="25" fill="#006c75" text-anchor="middle">m = 270 г</text><text x="470" y="280" font-size="25" fill="#b02069" text-anchor="middle">m = 780 г</text><line x1="30" y1="304" x2="610" y2="304" stroke="#d5dfe2" stroke-width="2"/><text x="30" y="344" font-size="25" fill="#8a6500" text-anchor="start">Равные массы: m = 100 г</text><rect x="88" y="370" width="160" height="80" rx="5" fill="#d9eef0" stroke="#006c75" stroke-width="3"/><rect x="438" y="370" width="64" height="80" rx="5" fill="#f6e1eb" stroke="#b02069" stroke-width="3"/><text x="168" y="485" font-size="24" fill="#006c75" text-anchor="middle">ρ = 2 г/см³</text><text x="470" y="485" font-size="24" fill="#b02069" text-anchor="middle">ρ = 5 г/см³</text><text x="168" y="520" font-size="25" fill="#006c75" text-anchor="middle">V = 50 см³</text><text x="470" y="520" font-size="25" fill="#b02069" text-anchor="middle">V = 20 см³</text><text x="320" y="561" font-size="24" fill="#24343b" text-anchor="middle">Меньшая плотность — больший объём</text></g></svg>