<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">Радиус планеты, высота и расстояние до центра</title>
  <desc id="desc">Расстояние от центра планеты до внешнего тела равно радиусу планеты плюс высота над поверхностью. Сила тяжести направлена к центру планеты.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b02069"/></marker></defs>
  <rect width="800" height="390" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="26" text-anchor="middle">
    <text x="400" y="40" fill="#006c75" font-weight="bold">Высота начинается у поверхности</text>
    <circle cx="205" cy="185" r="105" fill="#eaf5f5" stroke="#006c75" stroke-width="3"/>
    <circle cx="205" cy="185" r="5" fill="#006c75"/>
    <path d="M205 185 H660" stroke="#006c75" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="660" cy="185" r="12" fill="#b02069"/>
    <text x="660" y="146" fill="#b02069">тело</text>
    <path d="M643 185 H485" stroke="#b02069" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="552" y="160" fill="#b02069">Fтяж</text>
    <text x="205" y="155" fill="#006c75">центр</text>
    <path d="M205 212 V339 M310 212 V273 M660 212 V339" stroke="#006c75" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M205 260 H310 M205 252 V268 M310 252 V268" stroke="#006c75" stroke-width="3"/>
    <text x="257" y="245" fill="#006c75">R</text>
    <path d="M310 260 H660 M660 252 V268" stroke="#8a6500" stroke-width="3"/>
    <text x="485" y="245" fill="#8a6500">h</text>
    <path d="M205 326 H660 M205 318 V334 M660 318 V334" stroke="#167d37" stroke-width="3"/>
    <text x="430" y="365" fill="#167d37">r = R + h</text>
  </g>
</svg>
