<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 292" role="img" aria-labelledby="title desc">
  <title id="title">Движение тележек до и после сцепления</title>
  <desc id="desc">Верхний рисунок: тележки масс 0,60 и 0,40 килограмма движутся навстречу. Нижний рисунок: сцепившиеся тележки движутся влево. Ось x направлена вправо. Стрелки показывают направления без соблюдения масштаба.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263951"/>
    </marker>
  </defs>
  <rect width="440" height="292" rx="16" fill="#f4f8fd"/>
  <path d="M25 123H415 M25 248H415" stroke="#718398" stroke-width="2"/>
  <g stroke="#263951" stroke-width="3.5" marker-end="url(#arrow)" fill="none">
    <path d="M80 71H158"/>
    <path d="M352 71H274"/>
    <path d="M191 187H103"/>
    <path d="M298 272H400"/>
  </g>
  <g stroke-width="2">
    <rect x="44" y="86" width="116" height="34" rx="5" fill="#d5ebff" stroke="#285984"/>
    <rect x="280" y="86" width="116" height="34" rx="5" fill="#ffead1" stroke="#885226"/>
    <rect x="111" y="210" width="109" height="34" rx="5" fill="#d5ebff" stroke="#285984"/>
    <rect x="220" y="210" width="109" height="34" rx="5" fill="#ffead1" stroke="#885226"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#192d44">
    <text x="220" y="28" font-weight="700">До столкновения</text>
    <text x="119" y="59">2,0 м/с</text>
    <text x="313" y="59">4,0 м/с</text>
    <text x="102" y="110">0,60 кг</text>
    <text x="338" y="110">0,40 кг</text>
    <text x="220" y="154" font-weight="700">После сцепления</text>
    <text x="147" y="178">0,40 м/с</text>
    <text x="165" y="234">0,60 кг</text>
    <text x="275" y="234">0,40 кг</text>
    <text x="413" y="279">x</text>
  </g>
</svg>
