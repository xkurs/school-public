<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">Взаимное притяжение двух шаров</title>
  <desc id="desc">Силы одинаковы по модулю и направлены друг к другу. Расстояние r измеряется между центрами, а зазор — между поверхностями шаров.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b02069"/></marker></defs>
  <rect width="800" height="390" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="25" text-anchor="middle">
    <text x="400" y="40" fill="#006c75" font-weight="bold">Притяжение направлено навстречу</text>
    <circle cx="180" cy="155" r="60" fill="#eaf5f5" stroke="#006c75" stroke-width="3"/>
    <circle cx="620" cy="155" r="76" fill="#eaf5f5" stroke="#006c75" stroke-width="3"/>
    <circle cx="180" cy="155" r="5" fill="#006c75"/>
    <circle cx="620" cy="155" r="5" fill="#006c75"/>
    <path d="M180 155 H330" stroke="#b02069" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M620 155 H470" stroke="#b02069" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="280" y="130" fill="#b02069">F₁</text><text x="520" y="130" fill="#b02069">F₂</text>
    <text x="180" y="116" fill="#006c75">m₁</text><text x="620" y="112" fill="#006c75">m₂</text>
    <path d="M180 225 V312 M620 242 V312" stroke="#006c75" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M180 300 H620 M180 292 V308 M620 292 V308" stroke="#006c75" stroke-width="3"/>
    <text x="400" y="340" fill="#006c75">r — между центрами</text>
    <path d="M240 255 H544 M240 247 V263 M544 247 V263" stroke="#8a6500" stroke-width="3"/>
    <text x="392" y="237" fill="#8a6500">зазор</text>
    <text x="400" y="378" fill="#167d37">F₁ = F₂ · силы действуют на разные тела</text>
  </g>
</svg>
