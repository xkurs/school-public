<title id="title">Синусоидальный ток за один период</title><desc id="desc">Ток возрастает от нуля до амплитуды Iₘ при T/4, проходит ноль при T/2, достигает −Iₘ при 3T/4 и возвращается в ноль при T. В двух полупериодах направления тока противоположны. Скобка отмечает полный период T.</desc>
