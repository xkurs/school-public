<title id="title">Ток и мгновенная мощность идеального резистора</title><desc id="desc">Сверху i/Iₘ = sin(2πt/T), снизу p/pₘₐₓ = sin²(2πt/T). Обе временные оси охватывают один период тока T. Мощность неотрицательна, имеет два максимума за T, её среднее значение P = pₘₐₓ/2. Максимальная мощность pₘₐₓ = Iₘ²R.</desc>
<rect width="640" height="580" rx="12" fill="#fff"/>
