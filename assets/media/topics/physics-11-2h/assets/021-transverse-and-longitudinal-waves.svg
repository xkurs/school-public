<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Поперечная и продольная волны</title>
<desc id="desc">Две независимые схемы: синусоидальный изгиб верёвки и сжатия пружины. Стрелки различают распространение волны и смещение частицы.</desc>
