<svg xmlns="http://www.w3.org/2000/svg" width="780" height="570" viewBox="0 0 780 570" role="img" aria-labelledby="title desc">
<title id="title">Груз на резиновом жгуте</title><desc id="desc">Три состояния: без груза, перед отпусканием и первый верхний разворот. Жгут остаётся натянутым, высота подъёма равна разности длин.</desc>
