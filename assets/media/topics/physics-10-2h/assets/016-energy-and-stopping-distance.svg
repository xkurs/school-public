<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">Энергия и тормозной путь</title><desc id="desc">При скольжении только с трением удвоение скорости увеличивает кинетическую энергию и путь остановки вчетверо: при скорости десять метров в секунду путь двадцать метров, при двадцати путь восемьдесят. Коэффициент трения 0,25.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#006c75"/></marker><marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b02069"/></marker><marker id="ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8a6500"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#167d37"/></marker></defs><rect width="960" height="610" rx="22" fill="#f8fafb"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="32" fill="#006c75" font-weight="700" text-anchor="start">Трение уменьшает энергию движения</text><rect x="30" y="77" width="900" height="135" rx="18" fill="#ffffff" stroke="none"/><text x="55" y="115" font-size="24" fill="#243642" font-weight="700" text-anchor="start">При скольжении до остановки</text><text x="55" y="156" font-size="29" fill="#b02069" font-weight="400" text-anchor="start">Aтр = −μmgs</text><text x="371" y="156" font-size="29" fill="#006c75" font-weight="400" text-anchor="start">ΔEк = 0 − mv₀²/2</text><text x="55" y="191" font-size="22" fill="#243642" font-weight="400" text-anchor="start">Горизонталь · только трение · постоянный μ · N = mg</text><text x="36" y="258" font-size="25" fill="#8a6500" font-weight="700" text-anchor="start">Одна поверхность, одинаковый коэффициент трения</text><text x="45" y="304" font-size="25" fill="#006c75" font-weight="700" text-anchor="start">10 м/с</text><text x="45" y="336" font-size="23" fill="#006c75" font-weight="400" text-anchor="start">E₀</text><rect x="200" y="285" width="62" height="42" rx="6" fill="#d8eeee" stroke="#006c75"/><path d="M225 273 L281 273" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><path d="M215 357 L360 357" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="285" y="392" font-size="24" fill="#006c75" font-weight="400" text-anchor="middle">20 м</text><circle cx="360" cy="307" r="8" fill="#167d37"/><text x="384" y="315" font-size="22" fill="#167d37" font-weight="400" text-anchor="start">стоп</text><text x="45" y="449" font-size="25" fill="#b02069" font-weight="700" text-anchor="start">20 м/с</text><text x="45" y="481" font-size="23" fill="#b02069" font-weight="400" text-anchor="start">4E₀</text><rect x="200" y="430" width="62" height="42" rx="6" fill="#f6e0ec" stroke="#b02069"/><path d="M225 418 L337 418" stroke="#b02069" stroke-width="5" fill="none" marker-end="url(#rose)"/><path d="M215 502 L795 502" stroke="#b02069" stroke-width="5" fill="none" marker-end="url(#rose)"/><text x="505" y="537" font-size="24" fill="#b02069" font-weight="400" text-anchor="middle">80 м — в 4 раза дальше</text><circle cx="795" cy="452" r="8" fill="#167d37"/><text x="815" y="459" font-size="22" fill="#167d37" font-weight="400" text-anchor="start">стоп</text><text x="36" y="581" font-size="23" fill="#8a6500" font-weight="400" text-anchor="start">μ = 0,25; g = 10 м/с². Время реакции здесь не учитывается.</text></g></svg>
