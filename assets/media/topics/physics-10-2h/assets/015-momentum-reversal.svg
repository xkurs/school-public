<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Импульс при отскоке мяча</title><desc id="desc">Начальная проекция импульса плюс 1,2, конечная минус 0,8; изменение минус 2 кг·м/с. Средняя сила направлена влево.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#006c75"/></marker><marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b02069"/></marker><marker id="ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8a6500"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#167d37"/></marker></defs><rect width="960" height="600" rx="22" fill="#f8fafb"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="32" fill="#006c75" font-weight="700" text-anchor="start">При отскоке меняется направление</text><text x="36" y="84" font-size="23" fill="#243642" font-weight="400" text-anchor="start">Мяч 0,2 кг · ось направлена вправо</text><rect x="30" y="106" width="900" height="370" rx="18" fill="#ffffff" stroke="none"/><text x="58" y="151" font-size="25" fill="#243642" font-weight="700" text-anchor="start">До удара</text><text x="58" y="184" font-size="23" fill="#243642" font-weight="400" text-anchor="start">6 м/с вправо</text><circle cx="470" cy="166" r="17" fill="#006c75"/><path d="M488 166 L650 166" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="678" y="175" font-size="24" fill="#006c75" font-weight="400" text-anchor="start">p₁ₓ = 1,2 кг·м/с</text><text x="58" y="257" font-size="25" fill="#243642" font-weight="700" text-anchor="start">После удара</text><text x="58" y="290" font-size="23" fill="#243642" font-weight="400" text-anchor="start">4 м/с влево</text><circle cx="470" cy="272" r="17" fill="#b02069"/><path d="M452 272 L350 272" stroke="#b02069" stroke-width="5" fill="none" marker-end="url(#rose)"/><text x="530" y="281" font-size="24" fill="#b02069" font-weight="400" text-anchor="start">p₂ₓ = −0,8 кг·м/с</text><text x="58" y="369" font-size="25" fill="#243642" font-weight="700" text-anchor="start">Изменение</text><text x="58" y="427" font-size="23" fill="#243642" font-weight="400" text-anchor="start">Δpₓ = p₂ₓ − p₁ₓ</text><path d="M470 385 L170 385" stroke="#8a6500" stroke-width="5" fill="none" marker-end="url(#ochre)"/><text x="530" y="394" font-size="24" fill="#8a6500" font-weight="400" text-anchor="start">Δpₓ = −2 кг·м/с</text><path d="M470 125 L470 441" stroke="#bdcbd1" stroke-width="2" fill="none" stroke-dasharray="5 7"/><text x="36" y="523" font-size="25" fill="#8a6500" font-weight="700" text-anchor="start">Изменение — разность векторов, а не модулей.</text><text x="36" y="562" font-size="24" fill="#243642" font-weight="400" text-anchor="start">За 0,02 с: средняя горизонтальная сила 100 Н влево.</text></g></svg>
