<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 338" role="img" aria-labelledby="title desc">
  <title id="title">Как перейти от массы образца к числу частиц и обратно</title>
  <desc id="desc">Чтобы перейти от массы к количеству вещества, делят на молярную массу. Чтобы перейти от количества вещества к числу частиц, умножают на постоянную Авогадро. Обратные переходы выполняют обратными действиями.</desc>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#175a83"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#725019"/>
    </marker>
  </defs>
  <rect width="420" height="338" rx="14" fill="#f5f8fc"/>
  <g stroke="#33526c" stroke-width="1.6">
    <rect x="73" y="16" width="274" height="57" rx="10" fill="#dceefe"/>
    <rect x="73" y="141" width="274" height="57" rx="10" fill="#e1f2e8"/>
    <rect x="73" y="265" width="274" height="57" rx="10" fill="#faecd5"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#162b3c" font-size="20" text-anchor="middle">
    <text x="210" y="51" font-weight="650">Масса образца m</text>
    <text x="210" y="176" font-weight="650">Количество вещества ν</text>
    <text x="210" y="300" font-weight="650">Число частиц N</text>
    <text x="91" y="114">делим на M</text>
    <text x="326" y="114">умножаем на M</text>
    <text x="90" y="238">умножаем на Nₐ</text>
    <text x="326" y="238">делим на Nₐ</text>
  </g>
  <g fill="none" stroke-width="3.5">
    <path d="M181 78V135 M181 203V259" stroke="#175a83" marker-end="url(#down)"/>
    <path d="M241 135V78 M241 259V203" stroke="#725019" marker-end="url(#up)"/>
  </g>
</svg>
