<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Угол и знак работы силы</title><desc id="desc">Три схемы показывают острый, прямой и тупой углы между силой и перемещением и соответствующие знаки работы. Внизу сила разложена на составляющие; в работу входит составляющая вдоль перемещения.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#006c75"/></marker><marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b02069"/></marker><marker id="ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8a6500"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#167d37"/></marker></defs><rect width="960" height="600" rx="22" fill="#f8fafb"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="32" fill="#006c75" font-weight="700" text-anchor="start">Знак работы определяет угол</text><rect x="30" y="80" width="280" height="288" rx="18" fill="#ffffff" stroke="none"/><text x="50" y="119" font-size="25" fill="#167d37" font-weight="700" text-anchor="start">Острый угол</text><circle cx="105" cy="250" r="7" fill="#006c75"/><path d="M105 250 L270 250" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="255" y="282" font-size="24" fill="#006c75" font-weight="400" text-anchor="start">s</text><path d="M105 250 L180 160" stroke="#167d37" stroke-width="5" fill="none" marker-end="url(#green)"/><text x="192" y="160" font-size="24" fill="#167d37" font-weight="400" text-anchor="start">F</text><path d="M145 250 A40 40 0 0 0 130 218" fill="none" stroke="#167d37" stroke-width="2"/><text x="151" y="230" font-size="20" fill="#167d37" font-weight="400" text-anchor="start">α</text><text x="50" y="321" font-size="22" fill="#243642" font-weight="400" text-anchor="start">0° &lt; α &lt; 90°</text><text x="202" y="349" font-size="26" fill="#167d37" font-weight="700" text-anchor="start">A &gt; 0</text><rect x="340" y="80" width="280" height="288" rx="18" fill="#ffffff" stroke="none"/><text x="360" y="119" font-size="25" fill="#8a6500" font-weight="700" text-anchor="start">Прямой угол</text><circle cx="415" cy="250" r="7" fill="#006c75"/><path d="M415 250 L580 250" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="565" y="282" font-size="24" fill="#006c75" font-weight="400" text-anchor="start">s</text><path d="M415 250 L415 155" stroke="#8a6500" stroke-width="5" fill="none" marker-end="url(#ochre)"/><text x="427" y="155" font-size="24" fill="#8a6500" font-weight="400" text-anchor="start">F</text><path d="M415 229 H436 V250" fill="none" stroke="#8a6500" stroke-width="2"/><text x="360" y="321" font-size="22" fill="#243642" font-weight="400" text-anchor="start">α = 90°</text><text x="512" y="349" font-size="26" fill="#8a6500" font-weight="700" text-anchor="start">A = 0</text><rect x="650" y="80" width="280" height="288" rx="18" fill="#ffffff" stroke="none"/><text x="670" y="119" font-size="25" fill="#b02069" font-weight="700" text-anchor="start">Тупой угол</text><circle cx="725" cy="250" r="7" fill="#006c75"/><path d="M725 250 L890 250" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="875" y="282" font-size="24" fill="#006c75" font-weight="400" text-anchor="start">s</text><path d="M725 250 L685 160" stroke="#b02069" stroke-width="5" fill="none" marker-end="url(#rose)"/><text x="697" y="160" font-size="24" fill="#b02069" font-weight="400" text-anchor="start">F</text><path d="M765 250 A40 40 0 0 0 709 214" fill="none" stroke="#b02069" stroke-width="2"/><text x="750" y="211" font-size="20" fill="#b02069" font-weight="400" text-anchor="start">α</text><text x="670" y="321" font-size="22" fill="#243642" font-weight="400" text-anchor="start">90° &lt; α &lt; 180°</text><text x="822" y="349" font-size="26" fill="#b02069" font-weight="700" text-anchor="start">A &lt; 0</text><rect x="30" y="391" width="900" height="177" rx="18" fill="#eaf4f5" stroke="none"/><text x="55" y="432" font-size="25" fill="#006c75" font-weight="700" text-anchor="start">В работу входит составляющая силы вдоль перемещения</text><path d="M90 525 L260 525" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><path d="M90 525 L260 455" stroke="#b02069" stroke-width="5" fill="none" marker-end="url(#rose)"/><path d="M260 455 L260 525" stroke="#a7b9c1" stroke-width="2" fill="none" stroke-dasharray="5 5"/><text x="273" y="530" font-size="25" fill="#006c75" font-weight="400" text-anchor="start">F∥</text><text x="200" y="449" font-size="24" fill="#b02069" font-weight="400" text-anchor="start">F</text><text x="391" y="484" font-size="28" fill="#006c75" font-weight="400" text-anchor="start">F∥ = F cos α</text><text x="391" y="532" font-size="28" fill="#006c75" font-weight="700" text-anchor="start">A = F∥s</text></g></svg>
