<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Сцепление и реактивный выброс</title><desc id="desc">Вверху тележки массами два и один килограмм сцепляются и движутся со скоростью два метра в секунду. Внизу при выбросе из покоя газ и ракета получают противоположные импульсы равного модуля.</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#006c75"/></marker><marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b02069"/></marker><marker id="ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8a6500"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#167d37"/></marker></defs><rect width="960" height="600" rx="22" fill="#f8fafb"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="32" fill="#006c75" font-weight="700" text-anchor="start">Импульс системы: сцепление и отдача</text><rect x="30" y="75" width="900" height="250" rx="18" fill="#ffffff" stroke="none"/><text x="55" y="114" font-size="25" fill="#006c75" font-weight="700" text-anchor="start">Сцепление: внешний горизонтальный импульс ≈ 0</text><text x="55" y="150" font-size="23" fill="#243642" font-weight="400" text-anchor="start">До</text><text x="550" y="150" font-size="23" fill="#243642" font-weight="400" text-anchor="start">После</text><rect x="60" y="200" width="115" height="55" rx="8" fill="#d8eeee" stroke="#006c75"/><text x="117" y="236" font-size="23" fill="#243642" font-weight="400" text-anchor="middle">2 кг</text><rect x="280" y="200" width="100" height="55" rx="8" fill="#f6e0ec" stroke="#b02069"/><text x="330" y="236" font-size="23" fill="#243642" font-weight="400" text-anchor="middle">1 кг</text><path d="M90 183 L202 183" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="92" y="173" font-size="21" fill="#243642" font-weight="400" text-anchor="start">3 м/с</text><text x="285" y="183" font-size="21" fill="#243642" font-weight="400" text-anchor="start">покой</text><path d="M426 223 L493 223" stroke="#8a6500" stroke-width="5" fill="none" marker-end="url(#ochre)"/><rect x="560" y="200" width="115" height="55" rx="8" fill="#d8eeee" stroke="#006c75"/><rect x="675" y="200" width="100" height="55" rx="8" fill="#f6e0ec" stroke="#b02069"/><text x="667" y="236" font-size="23" fill="#243642" font-weight="400" text-anchor="middle">3 кг</text><path d="M604 183 L728 183" stroke="#167d37" stroke-width="5" fill="none" marker-end="url(#green)"/><text x="615" y="173" font-size="21" fill="#243642" font-weight="400" text-anchor="start">2 м/с</text><text x="56" y="295" font-size="24" fill="#167d37" font-weight="700" text-anchor="start">Полный импульс: 6 кг·м/с → 6 кг·м/с</text><rect x="30" y="344" width="900" height="230" rx="18" fill="#ffffff" stroke="none"/><text x="55" y="385" font-size="25" fill="#b02069" font-weight="700" text-anchor="start">Выброс из покоя: ракета вместе с газом</text><text x="55" y="421" font-size="22" fill="#243642" font-weight="400" text-anchor="start">Внешним импульсом пренебрегаем</text><rect x="408" y="454" width="138" height="55" rx="10" fill="#d8eeee" stroke="#006c75"/><text x="477" y="490" font-size="23" fill="#243642" font-weight="400" text-anchor="middle">ракета</text><circle cx="330" cy="481" r="10" fill="#b02069"/><circle cx="300" cy="470" r="7" fill="#b02069"/><circle cx="299" cy="495" r="7" fill="#b02069"/><path d="M328 448 L158 448" stroke="#b02069" stroke-width="5" fill="none" marker-end="url(#rose)"/><text x="160" y="482" font-size="22" fill="#b02069" font-weight="400" text-anchor="start">газ назад</text><path d="M558 481 L728 481" stroke="#006c75" stroke-width="5" fill="none" marker-end="url(#teal)"/><text x="602" y="452" font-size="22" fill="#006c75" font-weight="400" text-anchor="start">ракета вперёд</text><text x="55" y="547" font-size="23" fill="#167d37" font-weight="700" text-anchor="start">Противоположные импульсы: их векторная сумма равна нулю.</text></g></svg>
