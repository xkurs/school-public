<svg xmlns="http://www.w3.org/2000/svg" width="900" height="302" viewBox="0 0 900 302" role="img" aria-labelledby="title desc">
<title id="title">Вкладка и главный заголовок</title>
<desc id="desc">title задаёт название вкладки, h1 задаёт видимый заголовок общего примера 00.</desc>
<rect width="900" height="302" fill="#fff"/>
<text x="24" y="34" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Схема результата · общий пример 00</text>
<rect x="24" y="64" width="580" height="210" fill="#fff" stroke="#b8bec7"/>
<rect x="24" y="64" width="580" height="48" fill="#e2e8f0" stroke="#b8bec7"/>
<text x="44" y="95" font-family="sans-serif" font-size="22" fill="#111" font-weight="400">Техника дома · V00</text>
<text x="44" y="191" font-family="serif" font-size="38" fill="#111" font-weight="700">Техника дома · V00</text>
<text x="637" y="96" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">title · вкладка</text>
<text x="637" y="192" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">h1 · заголовок</text>
</svg>
