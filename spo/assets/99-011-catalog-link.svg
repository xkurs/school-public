<svg xmlns="http://www.w3.org/2000/svg" width="900" height="433" viewBox="0 0 900 433" role="img" aria-labelledby="title desc">
<title id="title">Ссылка на каталог</title>
<desc id="desc">Ссылка Посмотреть технику ведёт к заголовку Каталог техники. Подписи href и id являются пояснениями.</desc>
<rect width="900" height="433" fill="#fff"/>
<text x="24" y="34" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Схема результата · общий пример 00</text>
<rect x="24" y="64" width="530" height="300" fill="#fff" stroke="#b8bec7"/>
<text x="44" y="116" font-family="serif" font-size="26" fill="#0000ee" font-weight="400">Посмотреть технику</text>
<path d="M44 121 H266" stroke="#0000ee"/>
<text x="44" y="200" font-family="serif" font-size="32" fill="#111" font-weight="700">Каталог техники</text>
<text x="62" y="255" font-family="serif" font-size="25" fill="#111" font-weight="400">• Холодильник</text>
<text x="62" y="305" font-family="serif" font-size="25" fill="#111" font-weight="400">• Стиральная машина</text>
<text x="590" y="115" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">href=&quot;#catalog&quot;</text>
<text x="590" y="200" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">id=&quot;catalog&quot;</text>
<path d="M575 122 V190 H558" fill="none" stroke="#475569" stroke-width="2"/>
<text x="24" y="405" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Подписи справа — пояснения, не часть страницы.</text>
</svg>
