<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="620" viewBox="0 0 1230 620" role="img"><title>Навигация варианта 01</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36577b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5fa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17324d"><text x="35" y="45" font-size="30" fill="#17324d">Пять обработчиков — два пути возврата</text><rect x="40" y="100" width="330" height="210" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="60" y="140" font-size="26" fill="#17324d">Screen1</text><text x="60" y="173" font-size="22" fill="#17324d">Главная</text><rect x="450" y="100" width="330" height="210" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="470" y="140" font-size="26" fill="#17324d">RoutesScreen</text><text x="470" y="173" font-size="22" fill="#17324d">Каталог</text><rect x="860" y="100" width="330" height="210" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="880" y="140" font-size="26" fill="#17324d">BookingScreen</text><text x="880" y="173" font-size="22" fill="#17324d">Форма</text><text x="60" y="220" font-size="20" fill="#17324d">① Посмотреть маршруты</text><text x="60" y="265" font-size="20" fill="#17324d">② Записаться на прогулку</text><text x="470" y="220" font-size="20" fill="#17324d">③ Записаться</text><text x="470" y="265" font-size="20" fill="#17324d">④ На главную</text><text x="880" y="220" font-size="20" fill="#17324d">Текстовые поля</text><text x="880" y="265" font-size="20" fill="#17324d">⑤ Назад</text><path d="M370,200 L445,200" stroke="#36577b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780,200 L855,200" stroke="#36577b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M200,310 L200,365 L1025,365 L1025,315" stroke="#36577b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="400" y="352" font-size="20" fill="#17324d">② Открыть форму напрямую</text><rect x="40" y="405" width="1150" height="180" rx="12" fill="#e4f0e9" stroke="#c8d4e1" stroke-width="2"/><text x="65" y="444" font-size="25" fill="#17324d">Открытие: open another screen. Возврат: close screen.</text><text x="65" y="484" font-size="22" fill="#17324d">Путь А: главная → каталог → форма → назад в каталог → на главную</text><text x="65" y="524" font-size="22" fill="#17324d">Путь Б: главная → форма → назад на главную</text><text x="65" y="561" font-size="21" fill="#17324d">⑤ Один обработчик возвращает туда, откуда открыли форму.</text></g></svg>