<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">Карточка 27.2. Трассировка поиска</title><desc id="desc">Условие и пустые поля для работы в тетради. Перенесите номер карточки, буквы полей и сетку; условие остаётся на экране.</desc><rect width="1000" height="790" fill="#fffdf6"/><style>text{font-family:"Segoe Print","Comic Sans MS","DejaVu Sans",sans-serif;fill:#233848;font-size:24px}.heading{font-size:32px;font-weight:600}.code{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:22px}.small{font-size:22px}</style>
<text x="35" y="48" class="heading">27.2 · Трассировка поиска</text>
<text x="35" y="91" class="small">Каталог: «Набор Старт», «Набор Мини», «Набор Про».</text>
<text x="35" y="126" class="small">Старт: запрос пустой, видны все 3. После ввода: сохранить → render().</text>
<text x="35" y="161" class="small">1 — ввести «мини»; 2 — заменить на «НАБОР»; 3 — ввести «чайник».</text>
<text x="35" y="196" class="small">4 — сброс: пустой запрос → сохранить → render(); 5 — перезагрузка.</text>
<text x="35" y="231" class="small">Регистр не важен; пустой запрос — всё; нет совпадений —</text>
<text x="35" y="266" class="small">подпись «Ничего не найдено». Иначе — «Показано: … из 3».</text>
<text x="35" y="301" class="small">Запишите результат ПОСЛЕ каждого шага. Каталог не изменяется.</text>
