<text x="48" y="357" class="small">№</text>
<text x="95" y="357" class="small">А · state.query</text>
<text x="335" y="357" class="small">Б · Видимые карточки</text>
<text x="655" y="357" class="small">В · Подпись</text>
<text x="50" y="407" class="small">1</text>
<text x="50" y="473" class="small">2</text>
<text x="50" y="539" class="small">3</text>
<text x="50" y="605" class="small">4</text>
<text x="50" y="671" class="small">5</text>
<text x="35" y="735" class="small">Можно кратко: Старт, Мини, Про; пустая строка — «пусто».</text>
<text x="35" y="770" class="small">В тетрадь: номер карточки, буквы и сетку. Условие не переписывайте.</text>
</svg>
