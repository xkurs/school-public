<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">Карточка 26.4. Что восстановить?</title><desc id="desc">Пустые поля для самостоятельного заполнения в тетради. Перенесите номер карточки и обозначения полей.</desc><rect width="1000" height="800" fill="#fffdf6"/><style>text{font-family:"Segoe Print","Comic Sans MS","DejaVu Sans",sans-serif;fill:#233848;font-size:24px}.head{font-size:31px;font-weight:600}.code{font-family:Consolas,monospace;font-size:24px}</style>
<text x="30" y="46" class="head">26.4  Что восстановить?</text>
<text x="30" y="776" class="">В тетрадь: номер, буквы полей и сетка. Условие не переписывайте.</text>
<text x="30" y="94" class="">1 — ключа нет: null; 2 — строка {&quot;query&quot;:&quot;мини&quot;};</text>
<text x="30" y="131" class="">3 — строка не json; 4 — строка {&quot;query&quot;:25};</text>
<text x="30" y="168" class="">5 — строка {&quot;query&quot;:&quot;&quot;}.</text>
<text x="30" y="205" class="">А: использовать / пустой запрос. Б: причина в двух-трёх словах.</text>
<text x="30" y="242" class="">В и Г: впишите само неподходящее содержимое записи.</text>
<path d="M33 277 Q90.0 274 148 278 L150 335 Q90.0 339 31 337 Z" fill="#fff" stroke="#477185" stroke-width="2"/>
<text x="42" y="306" class="">Случай</text>
