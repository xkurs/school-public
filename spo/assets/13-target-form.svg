<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1229" viewBox="0 0 800 1229" role="img" aria-labelledby="title desc">
<title id="title">Форма — Спорт после пар · V13</title>
<desc id="desc">Визуальный учебный образец результата пар 15–16. Настоящие HTML-элементы нужно создать самостоятельно. Размеры условны, точное совпадение пикселей не требуется.</desc>
<rect width="800" height="1229" fill="#EAF7F5"/>
