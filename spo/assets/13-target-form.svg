<rect x="0" y="0" width="800" height="77" rx="0" fill="#176B64" stroke="none" stroke-width="0"/>
<text font-size="28" fill="#FFFFFF" font-weight="bold">
<tspan x="36" y="46">Спорт после пар · V13</tspan>
</text>
<g id="navigation" aria-label="Меню">
<rect x="36" y="97" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#176B64" stroke-width="2"/>
<text font-size="21" fill="#176B64">
<tspan x="54" y="127">Главная</tspan>
</text>
