<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Карточка 26.3. Вы — браузер</title><desc id="desc">Пустые поля для самостоятельного заполнения в тетради. Перенесите номер карточки и обозначения полей.</desc><rect width="1000" height="850" fill="#fffdf6"/><style>text{font-family:"Segoe Print","Comic Sans MS","DejaVu Sans",sans-serif;fill:#233848;font-size:24px}.head{font-size:31px;font-weight:600}.code{font-family:Consolas,monospace;font-size:24px}</style>
<text x="30" y="46" class="head">26.3  Вы — браузер</text>
<text x="30" y="826" class="">В тетрадь: номер, буквы полей и сетка. Условие не переписывайте.</text>
<text x="30" y="92" class="">1 — первое открытие; 2 — ввели мини и сохранили;</text>
<text x="30" y="128" class="">3 — обновили; 4 — ввели про и сохранили;</text>
<text x="30" y="164" class="">5 — очистили и сохранили; 6 — закрыли и снова открыли.</text>
<text x="30" y="200" class="">Карточки: Старт, Мини, Про. Пустой запрос: &quot;&quot;.</text>
<text x="30" y="238" class="">Б: впишите строку JSON целиком; если записи нет — «нет записи».</text>
