<text x="50" y="591" class="small">4</text>
<path d="M37 646 Q500.0 643 964 645 L966 746 Q500.0 749 35 747 Z" fill="#ffffff" stroke="#233848" stroke-width="2.3" stroke-linejoin="round"/>
<text x="50" y="673">Д · Что доказывает совместную работу сохранения и вывода?</text>
<text x="35" y="790" class="small">В тетрадь: номер карточки, буквы и сетку. Условие не переписывайте.</text>
</svg>
