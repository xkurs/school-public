<text x="48" y="331" class="small">№</text>
<text x="95" y="331" class="small">А · Действие</text>
<text x="325" y="331" class="small">Б · Поле</text>
<text x="495" y="331" class="small">В · Карточки</text>
<text x="745" y="331" class="small">Г · Подпись</text>
<text x="50" y="381" class="small">1</text>
