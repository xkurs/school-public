<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">Карточка 27.7. Проверка общего поиска</title><desc id="desc">Условие и пустые поля для работы в тетради. Перенесите номер карточки, буквы полей и сетку; условие остаётся на экране.</desc><rect width="1000" height="810" fill="#fffdf6"/><style>text{font-family:"Segoe Print","Comic Sans MS","DejaVu Sans",sans-serif;fill:#233848;font-size:24px}.heading{font-size:32px;font-weight:600}.code{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:22px}.small{font-size:22px}</style>
<text x="35" y="48" class="heading">27.7 · Проверка общего поиска</text>
<text x="35" y="91" class="small">Общий каталог: «Набор Старт», «Набор Мини», «Набор Про».</text>
<text x="35" y="126" class="small">Заполните 4 испытания: конкретное действие и ожидаемый экран.</text>
<text x="35" y="165" class="small">1 — ввод мини; 2 — ввод чайник (совпадений нет);</text>
<text x="35" y="200" class="small">3 — сброс; 4 — ввод про → сохранение → перезагрузка.</text>
<text x="35" y="239" class="small">В А укажите ввод и подготовку (в т. ч. сохранение перед шагом 4).</text>
<text x="35" y="274" class="small">В Б–Г — результат после действия. Это прогноз, запуск не требуется.</text>
