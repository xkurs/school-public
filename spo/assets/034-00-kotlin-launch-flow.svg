<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 440 480" role="img" aria-labelledby="title desc">
  <title id="title">Где запустить Kotlin</title>
  <desc id="desc">Сначала установить OpenIDE и запустить Kotlin. Если не получилось, попробовать Kotlin Playground или Kotlin CodeUtility в браузере. Если ни один способ не сработал, записать код и ожидаемый вывод.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#24627d"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="478" rx="15" fill="#fff" stroke="#c9dce4"/>
  <g font-family="Arial, sans-serif" fill="#123247" text-anchor="middle">
    <text x="220" y="31" font-size="21" font-weight="700">Где запустить Kotlin</text>
    <rect x="85" y="50" width="270" height="48" rx="8" fill="#e7f4fa" stroke="#397894" stroke-width="1.6"/>
    <text x="220" y="80" font-size="18" font-weight="600">Установить OpenIDE</text>
    <path d="M220 98V118" fill="none" stroke="#24627d" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M220 118L338 158L220 198L102 158Z" fill="#fff2d6" stroke="#9a641d" stroke-width="1.6"/>
    <text x="220" y="152.5" font-size="18" font-weight="600">Kotlin<tspan x="220" dy="23">запустился?</tspan></text>
    <path d="M102 158H99V225" fill="none" stroke="#24627d" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="74" y="183" font-size="17" font-weight="700">Да</text>
    <rect x="24" y="225" width="150" height="62" rx="24" fill="#e2f3eb" stroke="#287355" stroke-width="1.6"/>
    <text x="99" y="250.5" font-size="18" font-weight="600">Работать<tspan x="99" dy="23">в OpenIDE</tspan></text>
    <path d="M338 158H341V200" fill="none" stroke="#24627d" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="366" y="183" font-size="17" font-weight="700">Нет</text>
    <rect x="248" y="200" width="176" height="66" rx="8" fill="#e7f4fa" stroke="#397894" stroke-width="1.6"/>
    <text x="336" y="227.5" font-size="18" font-weight="600">Открыть сайт<tspan x="336" dy="23">запуска Kotlin</tspan></text>
    <path d="M336 266V288" fill="none" stroke="#24627d" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M336 288L427 323L336 358L245 323Z" fill="#fff2d6" stroke="#9a641d" stroke-width="1.6"/>
    <text x="336" y="317.5" font-size="18" font-weight="600">Запуск<tspan x="336" dy="23">удался?</tspan></text>
    <path d="M245 323H112V373" fill="none" stroke="#24627d" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="193" y="313" font-size="17" font-weight="700">Да</text>
    <rect x="21" y="373" width="182" height="66" rx="24" fill="#e2f3eb" stroke="#287355" stroke-width="1.6"/>
    <text x="112" y="400.5" font-size="18" font-weight="600">Работать<tspan x="112" dy="23">в браузере</tspan></text>
    <path d="M336 358V394" fill="none" stroke="#24627d" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="364" y="382" font-size="17" font-weight="700">Нет</text>
    <rect x="237" y="394" width="190" height="65" rx="24" fill="#e2f3eb" stroke="#287355" stroke-width="1.6"/>
    <text x="332" y="421" font-size="18" font-weight="600">Записать код<tspan x="332" dy="23">и прогноз вывода</tspan></text>
  </g>
</svg>
