<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">column — один столбец</title><desc id="desc">Карточки идут сверху вниз: 1, 2, 3, 4. В учебной модели карточки не сжимаются и не растут; места хватает только на три карточки в строке.</desc>
<rect width="640" height="400" rx="12" fill="white"/><g font-family="Arial, sans-serif">
<text x="24" y="34" font-size="24" fill="#1E293B" font-weight="bold">column — один столбец</text>
<rect x="36" y="66" width="352" height="286" rx="6" fill="#EFF6FF" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="52" y="94" width="96" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="92" y="126" font-size="25" fill="#1E293B" font-weight="bold">1</text>
<rect x="52" y="158" width="96" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="92" y="190" font-size="25" fill="#1E293B" font-weight="bold">2</text>
<rect x="52" y="222" width="96" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="92" y="254" font-size="25" fill="#1E293B" font-weight="bold">3</text>
<rect x="52" y="286" width="96" height="48" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="92" y="318" font-size="25" fill="#1E293B" font-weight="bold">4</text>
<text x="414" y="280" font-size="18" fill="#475569" font-weight="normal">Пунктир —</text>
<text x="414" y="305" font-size="18" fill="#475569" font-weight="normal">граница</text>
<text x="414" y="330" font-size="18" fill="#475569" font-weight="normal">контейнера</text>
<text x="24" y="384" font-size="21" fill="#1E293B" font-weight="normal">Карточки идут сверху вниз: 1, 2, 3, 4.</text>
</g></svg>
