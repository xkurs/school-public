<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980" role="img" aria-labelledby="title desc"><title id="title">Проверка количества и возврат итога</title><desc id="desc">Если количество неположительное или нецелое — вернуть ошибку без расчёта и выйти. Иначе итог равен величина на единицу умножить на количество плюс общая добавка. Вернуть строку с итогом и выйти из функции.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334e75"/></marker></defs><style>text{font-family:Arial,'DejaVu Sans',sans-serif;font-size:24px;fill:#172b4d}.small{font-size:22px}.title{font-size:30px;font-weight:700}.bold{font-weight:700}.edge{fill:none;stroke:#334e75;stroke-width:3;marker-end:url(#arr)}</style><rect width="800" height="980" rx="20" fill="#f8fafc"/><text x="32" y="43" text-anchor="start" class="title">Затем проверяем и считаем</text><text x="32" y="78" text-anchor="start" class="small">Функция расчёта · часть 2 из 2</text><rect x="60" y="100" width="400" height="55" rx="27.5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="260.0" y="135.5" text-anchor="middle" class="">Продолжение части 1</text><path d="M260 155V180" class="edge"/><path d="M260 180L460 260L260 340L60 260Z" fill="#fffbeb" stroke="#eab308" stroke-width="2"/><text x="260" y="268" text-anchor="middle" class="">quantity &gt; 0?</text><path d="M260 340V395" class="edge"/><text x="285" y="374" text-anchor="middle" class="small">да</text><path d="M260 395L460 475L260 555L60 475Z" fill="#fffbeb" stroke="#eab308" stroke-width="2"/><text x="260" y="468" text-anchor="middle" class="">quantity</text><text x="260" y="498" text-anchor="middle" class="">целое?</text><path d="M460 260H650V608" class="edge"/><text x="488" y="243" text-anchor="middle" class="small">нет</text><path d="M460 475H645" class="edge"/><text x="488" y="458" text-anchor="middle" class="small">нет</text><circle cx="650" cy="475" r="5" fill="#334e75"/><rect x="510" y="613" width="270" height="130" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="645.0" y="641.0" text-anchor="middle" class="small">Вернуть сообщение:</text><text x="645.0" y="671.0" text-anchor="middle" class="small">«Ошибка: нужно</text><text x="645.0" y="701.0" text-anchor="middle" class="small">положительное целое</text><text x="645.0" y="731.0" text-anchor="middle" class="small">количество»</text><path d="M645 743V773" class="edge"/><rect x="535" y="778" width="220" height="56" rx="28.0" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="645.0" y="814.0" text-anchor="middle" class="">Выход из функции</text><path d="M260 555V607" class="edge"/><text x="285" y="590" text-anchor="middle" class="small">да</text><rect x="40" y="613" width="440" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="646.0" text-anchor="middle" class="">totalAmount =</text><text x="260.0" y="676.0" text-anchor="middle" class="">unitAmount × quantity</text><text x="260.0" y="706.0" text-anchor="middle" class="">+ extraAmount</text><path d="M260 723V768" class="edge"/><rect x="40" y="773" width="440" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="806.0" text-anchor="middle" class="">Вернуть сообщение:</text><text x="260.0" y="836.0" text-anchor="middle" class="">«Итого: » + totalAmount</text><path d="M260 853V895" class="edge"/><rect x="120" y="900" width="280" height="55" rx="27.5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="260.0" y="935.5" text-anchor="middle" class="">Выход из функции</text></svg>