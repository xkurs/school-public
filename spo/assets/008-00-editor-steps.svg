<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790" role="img"><title>Шесть шагов создания обработчика</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36577b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5fa"/><g font-family="Segoe UI, Arial, sans-serif" fill="#17324d"><text x="35" y="45" font-size="29" fill="#17324d">Подключить кнопку: куда нажимать в редакторе</text><rect x="35" y="80" width="1110" height="83" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="113" font-size="24" fill="#17324d">1. Список экранов → Screen1</text><text x="55" y="144" font-size="20" fill="#17324d">Выберите экран, на котором находится кнопка.</text><rect x="35" y="180" width="1110" height="83" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="213" font-size="24" fill="#17324d">2. Blocks / Блоки</text><text x="55" y="244" font-size="20" fill="#17324d">Перейдите от оформления к поведению.</text><rect x="35" y="280" width="1110" height="83" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="313" font-size="24" fill="#17324d">3. Компонент → ButtonRoutes</text><text x="55" y="344" font-size="20" fill="#17324d">Откройте набор блоков нужной кнопки.</text><rect x="35" y="380" width="1110" height="83" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="413" font-size="24" fill="#17324d">4. when ButtonRoutes.Click do</text><text x="55" y="444" font-size="20" fill="#17324d">Перетащите событие в рабочую область.</text><rect x="35" y="480" width="1110" height="83" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="513" font-size="24" fill="#17324d">5. Built-in → Control → open another screen</text><text x="55" y="544" font-size="20" fill="#17324d">Вложите действие внутрь do.</text><rect x="35" y="580" width="1110" height="83" rx="12" fill="#fff" stroke="#c8d4e1" stroke-width="2"/><text x="55" y="613" font-size="24" fill="#17324d">6. screenName → RoutesScreen</text><text x="55" y="644" font-size="20" fill="#17324d">Присоедините имя существующего экрана.</text><text x="40" y="721" font-size="22" fill="#17324d">На телефоне: нажмите «Посмотреть маршруты» → должен открыться каталог.</text><text x="40" y="758" font-size="20" fill="#17324d">Учебная схема. Для своего варианта подставьте собственные имена.</text></g></svg>