<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Смысловые части страницы</title>
<desc id="desc">header, main и footer общего примера 00. Рамки и названия тегов являются пояснением.</desc>
<rect width="900" height="480" fill="#fff"/>
<text x="24" y="34" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Схема результата · общий пример 00</text>
<text x="24" y="75" font-family="sans-serif" font-size="20" fill="#475569" font-weight="400">Рамки — пояснение структуры, а не действие HTML.</text>
<rect x="24" y="102" width="852" height="106" fill="#fff" stroke="#b8bec7"/>
<text x="44" y="136" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">header</text>
<text x="44" y="180" font-family="serif" font-size="25" fill="#111" font-weight="400">Техника дома · V00 · пояснение · ссылка</text>
<rect x="24" y="224" width="852" height="106" fill="#fff" stroke="#b8bec7"/>
<text x="44" y="258" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">main</text>
<text x="44" y="302" font-family="serif" font-size="25" fill="#111" font-weight="400">Описание · изображение · каталог техники</text>
<rect x="24" y="346" width="852" height="106" fill="#fff" stroke="#b8bec7"/>
<text x="44" y="380" font-family="sans-serif" font-size="22" fill="#475569" font-weight="400">footer</text>
<text x="44" y="424" font-family="serif" font-size="25" fill="#111" font-weight="400">Учебный прототип · Вариант 00</text>
</svg>
