<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980" role="img" aria-labelledby="title desc"><title id="title">Проверка количества: пустой ввод и число</title><desc id="desc">Пустой текст даёт возврат ошибки и выход. Непустой текст преобразуется в число; если число не конечное — возврат ошибки и выход. Иначе продолжаются проверки второй части.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334e75"/></marker></defs><style>text{font-family:Arial,'DejaVu Sans',sans-serif;font-size:24px;fill:#172b4d}.small{font-size:22px}.title{font-size:30px;font-weight:700}.bold{font-weight:700}.edge{fill:none;stroke:#334e75;stroke-width:3;marker-end:url(#arr)}</style><rect width="800" height="980" rx="20" fill="#f8fafc"/><text x="32" y="43" text-anchor="start" class="title">Сначала проверяем ввод</text><text x="32" y="78" text-anchor="start" class="small">Функция расчёта · часть 1 из 2</text><rect x="60" y="105" width="400" height="55" rx="27.5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="260.0" y="140.5" text-anchor="middle" class="">Получены текст и две величины</text><path d="M260 160V190" class="edge"/><path d="M260 190L460 270L260 350L60 270Z" fill="#fffbeb" stroke="#eab308" stroke-width="2"/><text x="260" y="248" text-anchor="middle" class="">quantityText</text><text x="260" y="278" text-anchor="middle" class="">пуст после удаления</text><text x="260" y="308" text-anchor="middle" class="">пробелов?</text><path d="M460 270H505" class="edge"/><text x="483" y="252" text-anchor="middle" class="small">да</text><rect x="510" y="216" width="270" height="108" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="645.0" y="248.0" text-anchor="middle" class="small">Вернуть сообщение:</text><text x="645.0" y="278.0" text-anchor="middle" class="small">«Ошибка: укажите</text><text x="645.0" y="308.0" text-anchor="middle" class="small">количество»</text><path d="M645 324V351" class="edge"/><rect x="535" y="355" width="220" height="56" rx="28.0" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="645.0" y="391.0" text-anchor="middle" class="">Выход из функции</text><path d="M260 350V405" class="edge"/><text x="287" y="384" text-anchor="middle" class="small">нет</text><rect x="60" y="410" width="400" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="448.0" text-anchor="middle" class="">quantity =</text><text x="260.0" y="478.0" text-anchor="middle" class="">Number(quantityText)</text><path d="M260 500V570" class="edge"/><path d="M260 570L460 650L260 730L60 650Z" fill="#fffbeb" stroke="#eab308" stroke-width="2"/><text x="260" y="643" text-anchor="middle" class="">quantity —</text><text x="260" y="673" text-anchor="middle" class="">конечное число?</text><path d="M460 650H505" class="edge"/><text x="483" y="632" text-anchor="middle" class="small">нет</text><rect x="510" y="600" width="270" height="100" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="645.0" y="628.0" text-anchor="middle" class="small">Вернуть сообщение:</text><text x="645.0" y="658.0" text-anchor="middle" class="small">«Ошибка:</text><text x="645.0" y="688.0" text-anchor="middle" class="small">введите число»</text><path d="M645 700V727" class="edge"/><rect x="535" y="731" width="220" height="56" rx="28.0" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="645.0" y="767.0" text-anchor="middle" class="">Выход из функции</text><path d="M260 730V818" class="edge"/><text x="285" y="775" text-anchor="middle" class="small">да</text><rect x="60" y="823" width="400" height="70" rx="35.0" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="260.0" y="866.0" text-anchor="middle" class="">Продолжить: часть 2</text><text x="32" y="941" text-anchor="start" class="small">Знак = означает «сохранить значение».</text></svg>